<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f7cff">
  <title>LifeLink · Offline</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2433;background:radial-gradient(55% 45% at 8% 8%,#bcd7ff,transparent),radial-gradient(45% 45% at 92% 18%,#ffcfe4,transparent),radial-gradient(60% 55% at 55% 100%,#c3f3e0,transparent),#eef3fb}.card{width:min(520px,100%);padding:30px;border:1px solid rgba(255,255,255,.85);border-radius:26px;background:rgba(255,255,255,.72);box-shadow:0 18px 60px rgba(60,80,140,.14);text-align:center}.logo{width:64px;height:64px;display:block;margin:0 auto 16px}h1{margin:0 0 8px;font-size:26px}p{color:#667085;margin:0 0 20px}.btn{display:inline-block;padding:10px 18px;border-radius:99px;background:#1d2433;color:white;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./favicon.svg" alt="">
    <h1>You're offline</h1>
    <p>LifeLink's app shell is saved on this device, but this page needs an internet connection to load the latest workspace and connect to your account.</p>
    <a class="btn" href="./">Try again</a>
  </main>
</body>
</html>
