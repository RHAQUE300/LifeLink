name: Check LifeLink JavaScript

on:
  push:
    paths:
      - 'index.html'
      - 'cloudflare-worker.js'
      - '.github/workflows/check-lifelink-js.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker JavaScript
        run: node --check cloudflare-worker.js
      - name: Parse inline JavaScript in index.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)];
          let checked = 0;
          for (let i = 0; i < scripts.length; i++) {
            const source = scripts[i][1];
            if (!source.trim()) continue;
            try {
              new vm.Script(source, { filename: `index.html inline script ${i + 1}` });
              checked++;
            } catch (error) {
              console.error(error.stack || error);
              process.exitCode = 1;
            }
          }
          if (!process.exitCode) console.log(`Syntax OK: ${checked} inline script(s) checked.`);
          NODE
      - name: Regression-test AI quantity and unit safety checks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const worker = fs.readFileSync('cloudflare-worker.js', 'utf8');
          const match = worker.match(/function quantityConstraintIssues\([\s\S]*?\n}\n(?=\nfunction parseVerifierJson)/);
          if (!match) throw new Error('Could not locate quantityConstraintIssues in the Worker.');
          const check = vm.runInNewContext('(()=>{' + match[0] + '; return quantityConstraintIssues;})()');
          assert.ok(check('Target is 400 g daily', 'Total amount: 2450 g.').length, 'must catch 2450 g vs 400 g/day');
          assert.ok(check('Target is 400 g daily', 'Total amount: 2.45 kg.').length, 'must catch kg-to-g mismatch');
          assert.ok(check('Target is 400 g daily', 'Total amount: 2,450 g.').length, 'must parse thousands separators correctly');
          assert.ok(check('Target is 400 g daily', 'Total amount: 2 lb.').length, 'must normalise pounds to grams');
          assert.ok(check('Target is 400 g daily', 'Total amount: 20 oz.').length, 'must normalise ounces to grams');
          assert.ok(check('Do not exceed 400 g per day', 'Suggested amount: 450 g.').length > 0, 'must catch a 450 g amount that exceeds a 400 g daily limit');
          assert.ok(check('Do not exceed 400 g per day', 'Suggested amount: 400 g.').length === 0, 'must allow the stated quantity');
          console.log('AI quantity/unit safety regression checks passed.');
          NODE
